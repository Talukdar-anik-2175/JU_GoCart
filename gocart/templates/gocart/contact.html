{% extends "gocart/base.html" %}
{% load static %}

{% block title %}Contact & Query - JU EV Cart{% endblock %}

{% block content %}

<!-- Page Header -->
<section class="page-header text-center" style="margin-top: 120px; margin-bottom: 30px;">
  <div class="container">
    <h1 style="font-size: 2.8rem; color: #00695c; font-weight: bold;">Contact & Query</h1>
  </div>
</section>

<!-- Contact Information -->
<section class="container contact-info text-center mb-5">
  <p><strong>Email:</strong> support@juniv.edu</p>
  <p><strong>Phone:</strong> +8801274567890</p>
  <p><strong>Location:</strong> Jahangirnagar University, Savar, Dhaka</p>
</section>

<!-- Google Map -->
<section class="container mb-5">
  <div class="map-container" style="border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3648.1540315542975!2d90.2627675838157!3d23.88415612334789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755e9a239efc729%3A0x98f169839c041c1e!2sTransport%20Office%20%7C%20Jahangirnagar%20University!5e0!3m2!1sen!2sbd!4v1745849987467!5m2!1sen!2sbd" 
      width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</section>

<!-- Contact Form -->
<section class="container mb-5">
  <div class="contact-form" style="background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" name="name" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="col-md-6">
          <input type="email" name="email" class="form-control" placeholder="Your Email" required>
        </div>
      </div>
      <div class="mt-3">
        <input type="text" name="subject" class="form-control" placeholder="Subject" required>
      </div>
      <div class="mt-3">
        <textarea name="message" class="form-control" rows="5" placeholder="Describe your message..." required></textarea>
      </div>
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-submit btn-lg" style="background-color: #ff9900; color: #fff; font-weight: bold; border-radius: 10px;">Send Message</button>
      </div>
    </form>
  </div>
</section>

{% endblock %}
